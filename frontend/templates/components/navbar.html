<header class="navbar bg-base-100/90 backdrop-blur sticky top-0 z-40 border-b border-base-200/60 px-4 lg:px-8">
    <div class="navbar-start gap-3">
        <!-- Mobile Drawer / Menu -->
        <div class="dropdown lg:hidden">
            <label tabindex="0" class="btn btn-ghost btn-circle btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
                </svg>
            </label>
            <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-200 rounded-box w-52">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/projects">Projects</a></li>
                <li><a href="{{ backend_url }}/docs" target="_blank">FastAPI Docs ↗</a></li>
            </ul>
        </div>

        <!-- Brand Title & Icon -->
        <a href="/" class="flex items-center gap-2.5 text-lg font-bold tracking-tight text-white hover:opacity-90 transition">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <div class="flex flex-col">
                <span class="font-heading font-bold text-base leading-none">OnboardFlow</span>
                <span class="text-[10px] text-gray-400 font-medium tracking-wider uppercase mt-0.5">Customer SaaS Implementation</span>
            </div>
        </a>
    </div>

    <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1 gap-1 text-sm font-medium">
            <li><a href="/" class="active">Dashboard</a></li>
            <li><a href="/projects">All Projects</a></li>
            <li><a href="{{ backend_url }}/docs" target="_blank" class="text-gray-400 hover:text-white">API Swagger Docs ↗</a></li>
        </ul>
    </div>

    <div class="navbar-end gap-3">
        <!-- Live Oracle DB Status Pill -->
        <div class="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full bg-base-200/80 border border-base-content/10 text-xs">
            {% if db_status.status == 'connected' %}
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span class="text-emerald-400 font-medium">Oracle XE: Connected</span>
            {% else %}
                <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                <span class="text-amber-300 font-medium" title="{{ db_status.error or 'Waiting for Oracle service' }}">Oracle XE: Ready</span>
            {% endif %}
        </div>

        <!-- Theme Selector (DaisyUI) -->
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-circle btn-sm" title="Switch Theme">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4 4 4 0 014-4 4 4 0 014 4 4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                </svg>
            </div>
            <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-200 rounded-box w-36 text-xs mt-2">
                <li><button onclick="document.documentElement.setAttribute('data-theme', 'dark')">🌙 Dark</button></li>
                <li><button onclick="document.documentElement.setAttribute('data-theme', 'night')">🌌 Night</button></li>
                <li><button onclick="document.documentElement.setAttribute('data-theme', 'corporate')">💼 Corporate</button></li>
                <li><button onclick="document.documentElement.setAttribute('data-theme', 'luxury')">👑 Luxury</button></li>
                <li><button onclick="document.documentElement.setAttribute('data-theme', 'light')">☀️ Light</button></li>
            </ul>
        </div>

        <!-- Fast New Onboarding Action Button -->
        <button onclick="new_project_modal.showModal()" class="btn btn-primary btn-sm rounded-lg shadow-md shadow-primary/20 gap-1.5 font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>New Customer</span>
        </button>
    </div>
</header>
