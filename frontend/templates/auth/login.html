{% extends "base.html" %}

{% block title %}Sign In - OnboardFlow{% endblock %}

{% block head %}
<script>
    // Ensure authenticated users are redirected to dashboard
    requireGuest();
</script>
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/10 text-indigo-600 mb-4 ring-1 ring-indigo-500/20">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Welcome back</h2>
        <p class="mt-2 text-sm text-slate-600">
            Sign in to manage your customer onboarding and implementation pipelines.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 sm:rounded-2xl sm:px-10 border border-slate-200/70 relative">
            
            <!-- Message / Alert Target for HTMX -->
            <div id="login-message"></div>

            <form id="login-form" class="space-y-5" method="POST" action="/auth/login">
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Work Email
                    </label>
                    <div class="relative">
                        <input id="email" 
                               name="email" 
                               type="email" 
                               autocomplete="email" 
                               required 
                               placeholder="you@company.com" 
                               class="input input-bordered w-full bg-slate-50/50 focus:bg-white focus:input-primary transition-all text-sm pl-10" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700">
                            Password
                        </label>
                        <a href="#" class="text-xs font-medium text-indigo-600 hover:text-indigo-500">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input id="password" 
                               name="password" 
                               type="password" 
                               autocomplete="current-password" 
                               required 
                               placeholder="••••••••" 
                               class="input input-bordered w-full bg-slate-50/50 focus:bg-white focus:input-primary transition-all text-sm pl-10" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="label cursor-pointer p-0 gap-2">
                        <input type="checkbox" name="remember_me" class="checkbox checkbox-primary checkbox-xs rounded" checked />
                        <span class="label-text text-xs text-slate-600 font-medium">Remember for 30 days</span>
                    </label>
                </div>

                <div>
                    <button type="submit" 
                            id="login-btn" 
                            class="btn btn-primary w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium border-none shadow-md shadow-indigo-200">
                        <span>Sign In</span>
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                Don't have an account yet?
                <a href="{{ url_for('register_page') }}" class="font-semibold text-indigo-600 hover:text-indigo-500 underline ml-1">
                    Create free account
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
