{% extends "base.html" %}

{% block title %}Create Account - OnboardFlow{% endblock %}

{% block head %}
<script>
    // Ensure authenticated users are redirected to dashboard
    requireGuest();
</script>
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/10 text-indigo-600 mb-4 ring-1 ring-indigo-500/20">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Create your account</h2>
        <p class="mt-2 text-sm text-slate-600">
            Start managing enterprise onboarding flows and tracking implementation health.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 sm:rounded-2xl sm:px-10 border border-slate-200/70 relative">
            
            <!-- Message / Alert Target for HTMX -->
            <div id="register-message"></div>

            <form id="register-form" class="space-y-4" method="POST" action="/auth/register">
                <!-- Full Name -->
                <div>
                    <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Full Name
                    </label>
                    <div class="relative">
                        <input id="name" 
                               name="name" 
                               type="text" 
                               autocomplete="name" 
                               required 
                               placeholder="Jane Doe" 
                               class="input input-bordered w-full bg-slate-50/50 focus:bg-white focus:input-primary transition-all text-sm pl-10" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Work Email
                    </label>
                    <div class="relative">
                        <input id="email" 
                               name="email" 
                               type="email" 
                               autocomplete="email" 
                               required 
                               placeholder="jane@company.com" 
                               class="input input-bordered w-full bg-slate-50/50 focus:bg-white focus:input-primary transition-all text-sm pl-10" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </div>
                    </div>
                    <div id="email-validation-feedback"></div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Password
                    </label>
                    <div class="relative">
                        <input id="password" 
                               name="password" 
                               type="password" 
                               autocomplete="new-password" 
                               required 
                               placeholder="At least 6 characters" 
                               class="input input-bordered w-full bg-slate-50/50 focus:bg-white focus:input-primary transition-all text-sm pl-10" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <input id="confirm_password" 
                               name="confirm_password" 
                               type="password" 
                               autocomplete="new-password" 
                               required 
                               placeholder="Repeat your password" 
                               class="input input-bordered w-full bg-slate-50/50 focus:bg-white focus:input-primary transition-all text-sm pl-10" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            id="register-btn" 
                            class="btn btn-primary w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium border-none shadow-md shadow-indigo-200">
                        <span>Create Account</span>
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                Already registered?
                <a href="{{ url_for('login_page') }}" class="font-semibold text-indigo-600 hover:text-indigo-500 underline ml-1">
                    Sign in here
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
