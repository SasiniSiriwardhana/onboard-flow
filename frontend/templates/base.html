<!DOCTYPE html>
<html lang="en" data-theme="corporate" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Onboarding System{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Alpine.js CDN -->
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
    
    <!-- Custom Auth & Global Scripts -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full flex flex-col antialiased text-slate-800 selection:bg-indigo-500 selection:text-white" x-data="authStore()">

    <!-- Global Toast / Alert Target for HTMX -->
    <div id="global-toast" class="toast toast-top toast-end z-50"></div>

    <!-- Main Application Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="{{ url_for('dashboard') }}" class="flex items-center gap-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <div>
                        <span class="text-lg font-bold bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">OnboardFlow</span>
                        <span class="hidden sm:inline-block ml-1.5 px-2 py-0.5 text-[10px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200/60 rounded-full">SaaS Hub</span>
                    </div>
                </a>
            </div>

            <!-- Auth State Navigation (Controlled by Alpine.js & localStorage) -->
            <div class="flex items-center space-x-3">
                <!-- Logged Out View -->
                <template x-if="!isAuthenticated">
                    <div class="flex items-center space-x-2">
                        <a href="{{ url_for('login_page') }}" class="btn btn-ghost btn-sm text-slate-600 hover:text-slate-900 font-medium">Sign In</a>
                        <a href="{{ url_for('register_page') }}" class="btn btn-primary btn-sm bg-indigo-600 hover:bg-indigo-700 text-white border-none shadow-sm shadow-indigo-200">Get Started</a>
                    </div>
                </template>

                <!-- Logged In View -->
                <template x-if="isAuthenticated">
                    <div class="flex items-center space-x-3">
                        <a href="{{ url_for('tasks_page') }}" class="btn btn-sm btn-ghost text-slate-700 hover:text-indigo-600 font-semibold gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>Tasks</a>
                        <a href="{{ url_for('admin_dashboard_page') }}" class="btn btn-sm btn-ghost text-slate-700 hover:text-indigo-600 font-semibold gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>Admin</a>
                        <a href="{{ url_for('onboarding_page') }}" class="btn btn-sm btn-primary bg-indigo-600 hover:bg-indigo-700 text-white border-none shadow-sm gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            <span class="hidden sm:inline">Onboard Client</span>
                        </a>
                        <div class="flex items-center space-x-2 px-3 py-1.5 bg-slate-100/80 rounded-full border border-slate-200/60">
                            <div class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center font-bold" x-text="userInitials"></div>
                            <span class="text-xs font-semibold text-slate-700" x-text="currentUser?.name || 'User'"></span>
                        </div>
                        <button @click="logout()" class="btn btn-ghost btn-xs text-slate-500 hover:text-rose-600 transition-colors">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Logout
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Application Footer -->
    <footer class="bg-white border-t border-slate-200/80 py-6 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>&copy; 2026 Customer Onboarding System. All rights reserved.</p>
            <div class="flex items-center space-x-4">
                <span class="inline-flex items-center gap-1.5 text-emerald-600 font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    FastAPI + Oracle DB Ready
                </span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
