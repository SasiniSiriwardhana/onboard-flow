version: '3.8'

services:
  # Oracle Database Free/XE (Optional containerized database service)
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: onboarding-oracle-db
    environment:
      ORACLE_PASSWORD: mypassword
      APP_USER: system
      APP_USER_PASSWORD: mypassword
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - onboarding-net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: onboarding-backend
    ports:
      - "8000:8000"
    environment:
      - ORACLE_USER=system
      - ORACLE_PASSWORD=mypassword
      - ORACLE_HOST=oracle-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE_NAME=FREEPDB1
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - onboarding-net
    volumes:
      - ./backend:/app/backend

  # Flask Frontend Service
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: onboarding-frontend
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:8000
      - FRONTEND_PORT=5000
      - DEBUG=True
    depends_on:
      - backend
    networks:
      - onboarding-net
    volumes:
      - ./frontend:/app/frontend

networks:
  onboarding-net:
    driver: bridge

volumes:
  oracle-data:
    driver: local
