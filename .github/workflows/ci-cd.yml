name: OnboardFlow Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy oracledb pydantic pytest httpx requests python-dotenv

      - name: Run Backend Unit & Integration Tests
        run: |
          PYTHONPATH=. pytest backend/tests/ -v

  frontend-test:
    name: Frontend Test Suite (Flask + HTMX + Alpine.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Frontend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest requests python-dotenv

      - name: Run Frontend Route & UI Integration Tests
        run: |
          PYTHONPATH=. pytest frontend/tests/ -v

  build-and-lint:
    name: Code Quality & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Security & Syntax Audit
        run: |
          python -m py_compile backend/server.py frontend/app.py
